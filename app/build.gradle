plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.sved.inzhener'
    compileSdk 34

    defaultConfig {
        applicationId "ru.sved.inzhener"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0-СТАНЦИЯ"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
